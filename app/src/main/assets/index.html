<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Sudoku</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf3ff;font:16px system-ui,sans-serif}main{max-width:540px;margin:auto;padding:20px 12px}header,.stats,.tools,.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{margin:0 0 14px;font-size:27px}select,button{background:#253348;color:white;border:1px solid #42536b;border-radius:9px;padding:11px;font:inherit}button{cursor:pointer}select{min-width:115px}.stats{font-size:13px;margin:12px 0}.board{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #b2c4db;aspect-ratio:1}.cell{border:0;border-right:1px solid #47576c;border-bottom:1px solid #47576c;border-radius:0;padding:0;background:#192537;font-size:clamp(15px,5vw,25px);font-weight:650;min-width:0}.cell:nth-child(3n){border-right:2px solid #b2c4db}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #b2c4db}.cell:nth-child(n+73){border-bottom:0}.cell.fixed{color:#f5f7fb;font-weight:800}.cell.user{color:#79b9ff}.cell.related{background:#27374e}.cell.same{background:#33577b}.cell.active{background:#315c88;outline:2px solid #a9d4ff;outline-offset:-2px;z-index:1}.cell.wrong{color:#ff7777;background:#4b2734}.pencil{display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(7px,2vw,11px);color:#b9c9df;width:100%;height:100%;align-items:center}.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:15px 0}.numbers button{padding:12px 0;font-size:22px;font-weight:bold;color:#8ac7ff}.tools{margin:10px 0}.tools button{flex:1;font-size:13px;padding:12px 3px}.tools .enabled{background:#2866a4}.actions button{flex:1}#new{background:#2879c8}#message{text-align:center;min-height:20px;color:#b8c8dc;font-size:13px;margin-top:12px}
</style></head><body><main><header><h1>Sudoku</h1><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></header><div class="stats"><span id="level">Medium</span><span id="time">00:00</span><span id="mistakes">Mistakes 0/3</span></div><div id="board" class="board"></div><div id="message">Select a square to begin</div><div id="numbers" class="numbers"></div><div class="tools"><button id="erase">Erase</button><button id="notes">Notes</button><button id="hint">Hint (3)</button><button id="undo">Undo</button></div><div class="actions"><button id="new">New game</button><button id="restart">Restart</button></div></main><script>
(()=>{const $=id=>document.getElementById(id);let solution=[],puzzle=[],values=[],pencils=[],selected=-1,mistakes=0,hints=3,seconds=0,notesMode=false,history=[],done=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){let rows=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(x=>b*3+x)),cols=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(x=>b*3+x)),digits=shuffle([1,2,3,4,5,6,7,8,9]);return rows.flatMap(r=>cols.map(c=>digits[(r*3+(r/3|0)+c)%9]))}
function choices(b,i){let r=i/9|0,c=i%9,used=new Set;for(let k=0;k<9;k++){used.add(b[r*9+k]);used.add(b[k*9+c]);used.add(b[((r/3|0)*3+(k/3|0))*9+(c/3|0)*3+k%3])}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function count(b,limit=2){let best=-1,opts;for(let i=0;i<81;i++)if(!b[i]){let c=choices(b,i);if(!c.length)return 0;if(!opts||c.length<opts.length){best=i;opts=c;if(c.length===1)break}}if(best<0)return 1;let total=0;for(let n of opts){b[best]=n;total+=count(b,limit-total);if(total>=limit)break}b[best]=0;return total}
function store(){localStorage.setItem('sudoku-save',JSON.stringify({solution,puzzle,values,pencils:pencils.map(s=>[...s]),selected,mistakes,hints,seconds,notesMode,done,difficulty:$('difficulty').value}))}
function fresh(){solution=generate();puzzle=solution.slice();let target={easy:38,medium:47,hard:53}[$('difficulty').value],removed=0;for(let i of shuffle([...Array(81).keys()])){if(removed>=target)break;let old=puzzle[i];puzzle[i]=0;if(count(puzzle.slice())!==1)puzzle[i]=old;else removed++}reset()}
function reset(){values=puzzle.slice();pencils=Array.from({length:81},()=>new Set);selected=-1;mistakes=0;hints=3;seconds=0;notesMode=false;history=[];done=false;$('message').textContent='Select a square to begin';draw()}
function snapshot(){history.push({values:values.slice(),pencils:pencils.map(s=>[...s]),mistakes,hints});if(history.length>100)history.shift()}
function enter(n){if(done||selected<0||puzzle[selected])return;if(notesMode&&n){snapshot();pencils[selected].has(n)?pencils[selected].delete(n):pencils[selected].add(n)}else{if(values[selected]===n)return;snapshot();values[selected]=n;pencils[selected].clear();if(n&&n!==solution[selected]){mistakes++;$('message').textContent='Incorrect number'}else $('message').textContent='';if(mistakes>=3){done=true;$('message').textContent='Game over. Undo or start a new game'}else if(values.every((v,i)=>v===solution[i])){done=true;$('message').textContent='You solved it!'}}draw()}
function draw(){let board=$('board');board.replaceChildren();for(let i=0;i<81;i++){let b=document.createElement('button');b.className='cell';let r=i/9|0,c=i%9;if(puzzle[i])b.classList.add('fixed');else if(values[i])b.classList.add('user');if(selected>=0){let sr=selected/9|0,sc=selected%9;if(r===sr||c===sc||(r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0))b.classList.add('related');if(values[i]&&values[i]===values[selected])b.classList.add('same');if(i===selected)b.classList.add('active')}if(values[i]&&values[i]!==solution[i])b.classList.add('wrong');if(values[i])b.textContent=values[i];else if(pencils[i].size){let p=document.createElement('div');p.className='pencil';for(let n=1;n<=9;n++){let s=document.createElement('span');s.textContent=pencils[i].has(n)?n:'';p.append(s)}b.append(p)}b.onclick=()=>{selected=i;draw()};board.append(b)}$('level').textContent=$('difficulty').value.toUpperCase();$('mistakes').textContent='Mistakes '+mistakes+'/3';$('hint').textContent='Hint ('+hints+')';$('notes').classList.toggle('enabled',notesMode);$('time').textContent=String(seconds/60|0).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');store()}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>enter(n);$('numbers').append(b)}
$('erase').onclick=()=>enter(0);$('notes').onclick=()=>{notesMode=!notesMode;draw()};$('undo').onclick=()=>{let h=history.pop();if(!h)return;values=h.values;pencils=h.pencils.map(x=>new Set(x));mistakes=h.mistakes;hints=h.hints;done=false;draw()};$('hint').onclick=()=>{if(done||!hints)return;let i=selected>=0&&!puzzle[selected]&&values[selected]!==solution[selected]?selected:values.findIndex((v,j)=>!puzzle[j]&&v!==solution[j]);if(i<0)return;snapshot();selected=i;values[i]=solution[i];pencils[i].clear();hints--;if(values.every((v,j)=>v===solution[j])){done=true;$('message').textContent='You solved it!'}draw()};$('new').onclick=fresh;$('restart').onclick=reset;$('difficulty').onchange=fresh;
try{let s=JSON.parse(localStorage.getItem('sudoku-save'));if(!s||s.solution.length!==81)throw Error('missing');Object.assign(window,{});solution=s.solution;puzzle=s.puzzle;values=s.values;pencils=s.pencils.map(x=>new Set(x));selected=s.selected;mistakes=s.mistakes;hints=s.hints;seconds=s.seconds;notesMode=s.notesMode;done=s.done;$('difficulty').value=s.difficulty;draw()}catch(e){fresh()}
setInterval(()=>{if(!done){seconds++;$('time').textContent=String(seconds/60|0).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');store()}},1000);
})();</script></body></html>
