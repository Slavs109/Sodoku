<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sudoku</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#0c1524;color:#f1f4fa;font-family:system-ui,-apple-system,sans-serif}
main{max-width:580px;height:100dvh;margin:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
header,.status,.tools,.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:26px;margin:0;color:#e7c58a}button,select{background:#22354b;color:#fff;border:1px solid #536780;border-radius:10px;padding:10px;font:inherit}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid #f2cc83}select{max-width:140px}.status{font-size:13px;color:#c3d1e4}.status strong{color:#fff}
#board{width:min(100%,calc(100dvh - 310px));max-width:500px;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);align-self:center;border:3px solid #d4b77d;border-radius:5px;overflow:hidden;box-shadow:0 8px 25px #0007}
.cell{border:0;border-right:1px solid #4b5d74;border-bottom:1px solid #4b5d74;border-radius:0;background:#18273a;color:#f6f8fb;font-size:clamp(15px,5vw,27px);font-weight:750;padding:0;min-width:0}
.cell:nth-child(3n){border-right:2px solid #b5c3d7}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #b5c3d7}.cell:nth-child(n+73){border-bottom:0}
.cell.user{color:#8ecaff}.cell.related{background:#273c53}.cell.same{background:#31587c}.cell.active{background:#376a97;box-shadow:inset 0 0 0 2px #c1e6ff}.cell.wrong{background:#98263c!important;color:#fff!important;box-shadow:inset 0 0 0 2px #ff8a99}
.pencil{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;align-items:center;color:#b5c8df;font-size:clamp(7px,1.8vw,11px)}
#message{min-height:25px;text-align:center;font-size:13px;color:#aebfd5;padding:4px}#message.error{background:#a11e34;border:2px solid #ff8d9b;color:#fff;border-radius:10px;padding:9px;font-weight:800;font-size:15px}
#numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}#numbers button{padding:12px 0;font-size:clamp(18px,5vw,24px);font-weight:750;color:#9bd4ff}#numbers button.hidden{visibility:hidden;pointer-events:none}
.tools button{flex:1;font-size:13px;padding:11px 3px}.tools button.active{background:#276da5;border-color:#a4dcff}.actions button{flex:1}#new{background:#286b9f;border-color:#5ba5df}
#pause-screen{display:none;position:fixed;inset:0;background:#0a1325f5;z-index:5;align-items:center;justify-content:center;flex-direction:column;gap:18px}#pause-screen.show{display:flex}
@media(max-height:650px){main{gap:4px;padding:5px 10px}h1{font-size:21px}#board{width:min(100%,calc(100dvh - 245px))}.tools button,.actions button{padding:6px 3px}#numbers button{padding:6px 0}.status{font-size:11px}}
</style></head><body><main>
<header><h1>Sudoku</h1><select id="difficulty" aria-label="Difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option><option value="master">Master</option></select></header>
<div class="status"><span id="time">00:00</span><span id="mistakes">Mistakes 0/3</span><button id="pause">Pause</button></div>
<div id="board" aria-label="Sudoku puzzle"></div><div id="message" role="status" aria-live="polite">Select a square to begin</div>
<div id="numbers" aria-label="Number keypad"></div>
<div class="tools"><button id="erase">Erase</button><button id="notes">Notes</button><button id="hint">Hint (3)</button><button id="undo">Undo</button></div>
<div class="actions"><button id="new">New puzzle</button><button id="restart">Restart</button></div>
</main><div id="pause-screen"><h2>Game paused</h2><button id="resume">Resume</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);
let solution=[],puzzle=[],values=[],pencils=[],selected=-1,mistakes=0,hints=3,seconds=0,notesMode=false,done=false,paused=false,history=[],difficulty='medium';
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function candidates(a,i){let r=i/9|0,c=i%9,used=new Set;for(let k=0;k<9;k++){used.add(a[r*9+k]);used.add(a[k*9+c]);used.add(a[(r/3|0)*27+(c/3|0)*3+(k/3|0)*9+k%3])}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function solve(a,randomize=false){let best=-1,opts;for(let i=0;i<81;i++)if(!a[i]){let c=candidates(a,i);if(!c.length)return false;if(!opts||c.length<opts.length){best=i;opts=c;if(c.length===1)break}}if(best<0)return true;if(randomize)shuffle(opts);for(let n of opts){a[best]=n;if(solve(a,randomize))return true}a[best]=0;return false}
function countSolutions(a,limit=2){let best=-1,opts;for(let i=0;i<81;i++)if(!a[i]){let c=candidates(a,i);if(!c.length)return 0;if(!opts||c.length<opts.length){best=i;opts=c;if(c.length===1)break}}if(best<0)return 1;let total=0;for(let n of opts){a[best]=n;total+=countSolutions(a,limit-total);if(total>=limit)break}a[best]=0;return total}
function store(){localStorage.setItem('sudoku-save',JSON.stringify({solution,puzzle,values,pencils:pencils.map(x=>[...x]),selected,mistakes,hints,seconds,notesMode,done,paused,difficulty,gameMode:'classic'}))}
function draw(){let board=$('board');board.replaceChildren();for(let i=0;i<81;i++){let b=document.createElement('button');b.className='cell';let r=i/9|0,c=i%9;if(!puzzle[i]&&values[i])b.classList.add('user');if(selected>=0){let sr=selected/9|0,sc=selected%9;if(r===sr||c===sc||(r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0))b.classList.add('related');if(values[i]&&values[i]===values[selected])b.classList.add('same');if(i===selected)b.classList.add('active')}if(values[i]&&values[i]!==solution[i])b.classList.add('wrong');if(values[i])b.textContent=values[i];else if(pencils[i].size){let p=document.createElement('div');p.className='pencil';for(let n=1;n<=9;n++){let sp=document.createElement('span');sp.textContent=pencils[i].has(n)?n:'';p.append(sp)}b.append(p)}b.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1)+(values[i]?', '+values[i]:', empty'));b.onclick=()=>{if(paused||done)return;selected=i;draw()};board.append(b)}
for(let n=1;n<=9;n++){let btn=$('numbers').children[n-1];let complete=values.filter(v=>v===n).length>=9;btn.classList.toggle('hidden',complete);btn.disabled=complete}
$('mistakes').textContent='Mistakes '+mistakes+'/3';$('hint').textContent='Hint ('+hints+')';$('notes').classList.toggle('active',notesMode);$('time').textContent=String(seconds/60|0).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');store()}
function message(t,error=false){$('message').textContent=t;$('message').classList.toggle('error',error)}
function snapshot(){history.push({values:values.slice(),pencils:pencils.map(x=>[...x]),mistakes,hints});if(history.length>100)history.shift()}
function checkWin(){if(values.every((v,i)=>v===solution[i])){done=true;message('Puzzle complete! Great job.');return true}return false}
function enter(n){if(paused||done||selected<0||puzzle[selected])return;if(notesMode&&n){snapshot();pencils[selected].has(n)?pencils[selected].delete(n):pencils[selected].add(n);message('');draw();return}if(values[selected]===n)return;snapshot();values[selected]=n;pencils[selected].clear();if(n&&n!==solution[selected]){mistakes++;message('✕ WRONG NUMBER — '+n+' is incorrect!',true);if(navigator.vibrate)navigator.vibrate(90)}else message('');if(mistakes>=3){done=true;message('✕ GAME OVER — 3 mistakes. Undo or start again.',true)}else checkWin();draw()}
function reset(){values=puzzle.slice();pencils=Array.from({length:81},()=>new Set);selected=-1;mistakes=0;hints=3;seconds=0;notesMode=false;done=false;paused=false;history=[];$('pause-screen').classList.remove('show');message('Select a square to begin');draw()}
function fresh(){difficulty=$('difficulty').value;solution=Array(81).fill(0);solve(solution,true);puzzle=solution.slice();let target={easy:38,medium:47,hard:53,expert:56,master:58}[difficulty],removed=0;for(let i of shuffle([...Array(81).keys()])){if(removed>=target)break;let old=puzzle[i];puzzle[i]=0;if(countSolutions(puzzle.slice())!==1)puzzle[i]=old;else removed++}reset()}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>enter(n);$('numbers').append(b)}
$('erase').onclick=()=>enter(0);$('notes').onclick=()=>{notesMode=!notesMode;draw()};$('hint').onclick=()=>{if(done||paused||!hints)return;let i=selected>=0&&!puzzle[selected]&&values[selected]!==solution[selected]?selected:values.findIndex((v,j)=>!puzzle[j]&&v!==solution[j]);if(i<0)return;snapshot();selected=i;values[i]=solution[i];pencils[i].clear();hints--;message('Hint: the correct number is '+solution[i]);checkWin();draw()};$('undo').onclick=()=>{if(paused)return;let h=history.pop();if(!h)return;values=h.values;pencils=h.pencils.map(x=>new Set(x));mistakes=h.mistakes;hints=h.hints;done=false;message('Last move undone');draw()};$('new').onclick=fresh;$('restart').onclick=reset;$('difficulty').onchange=fresh;$('pause').onclick=()=>{if(done)return;paused=true;$('pause-screen').classList.add('show');store()};$('resume').onclick=()=>{paused=false;$('pause-screen').classList.remove('show');store()};
try{let saved=JSON.parse(localStorage.getItem('sudoku-save'));if(!saved||!Array.isArray(saved.solution)||saved.solution.length!==81||!Array.isArray(saved.puzzle)||saved.puzzle.length!==81||!Array.isArray(saved.values)||saved.values.length!==81)throw Error('invalid');solution=saved.solution;puzzle=saved.puzzle;values=saved.values;pencils=Array.from({length:81},(_,i)=>new Set(saved.pencils&&saved.pencils[i]||[]));selected=Number.isInteger(saved.selected)?saved.selected:-1;mistakes=saved.mistakes||0;hints=saved.hints??3;seconds=saved.seconds||0;notesMode=!!saved.notesMode;done=!!saved.done;paused=!!saved.paused;difficulty=saved.difficulty||'medium';$('difficulty').value=difficulty;$('pause-screen').classList.toggle('show',paused);draw()}catch(e){fresh()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!done){paused=true;$('pause-screen').classList.add('show');store()}});setInterval(()=>{if(!done&&!paused){seconds++;$('time').textContent=String(seconds/60|0).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');store()}},1000);
})();</script></body></html>
