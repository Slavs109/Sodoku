</style></head><body><main><header><h1>Sudoku</h1><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option><option value="master">Master</option></select></header><div class="actions"><button id="daily">Daily challenge</button><button id="classic">Classic</button></div><div class="actions"><button id="campaign">Campaign</button><button id="pause">Pause</button><button id="auto-notes">Auto-notes</button></div><div class="stats"><span id="level">Medium</span><span id="time">00:00</span><span id="mistakes">Mistakes 0/3</span></div><div id="daily-label" class="small"></div><div id="trophies">🏆 Trophies: <span id="trophy-count">0</span> <span id="trophy-breakdown"></span></div><div id="board-wrap"><div id="board" class="board"></div></div><div id="message">Select a square to begin</div><div id="numbers" class="numbers"></div><div class="tools"><button id="erase">Erase</button><button id="notes">Notes</button><button id="hint">Hint (3)</button><button id="undo">Undo</button></div><div class="actions"><button id="new">New game</button><button id="restart">Restart</button></div><div id="level-panel"><div id="rank">Level 1 · Novice</div><div id="xp-track"><div id="xp-fill"></div></div><div id="xp-label" class="small"></div><div id="tier" class="small"></div></div><div class="panel"><h3>Campaign · 120 levels</h3><div id="campaign-info" class="small"></div><div id="campaign-levels"></div></div><div class="panel"><h3>Sound and vibration</h3><label><input type="checkbox" id="sound"> Sound effects</label> <label><input type="checkbox" id="haptic"> Haptic feedback</label></div><div class="panel"><h3>Theme</h3><select id="theme"><option value="neon">Neon blue</option><option value="light">Classic light</option><option value="amoled">AMOLED black</option><option value="samurai">Samurai</option></select></div><div class="panel"><h3>Statistics</h3><div id="statistics"></div></div><div class="panel"><h3>Achievements</h3><div id="achievements"></div></div></main><div id="pause-screen"><h2>Game paused</h2><p>The timer is stopped and the puzzle is hidden.</p><button id="resume">Resume game</button></div><div id="celebrate"><div class="modal"><div class="cup">🏆</div><h2>Trophy earned!</h2><p id="award-message"></p><button id="close-award">Continue</button></div></div><script>
(()=>{const $=id=>document.getElementById(id);let solution=[],puzzle=[],values=[],pencils=[],selected=-1,mistakes=0,hints=3,seconds=0,notesMode=false,history=[],done=false,lastChanged=-1;let trophies={easy:0,medium:0,hard:0},gameMode='classic',dailyDate='',hintUsed=0,awarded=false;

try{progress=Object.assign(progress,JSON.parse(localStorage.getItem('sudoku-progress')||'{}'))}catch(e){}
let random=Math.random,paused=false,campaignLevel=0,autoNotes=false;
let xpData={xp:0,campaignCleared:[],tierCounts:{bronze:0,silver:0,gold:0,diamond:0}};
try{xpData=Object.assign(xpData,JSON.parse(localStorage.getItem('sudoku-xp')||'{}'))}catch(e){}

let audioContext=null;
function effects(type){if(localStorage.getItem('sudoku-haptic')==='true'&&navigator.vibrate)navigator.vibrate(type==='win'?[45,40,80]:type==='error'?[70]:[12]);
if(localStorage.getItem('sudoku-sound')!=='true')return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();let o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.type='sine';o.frequency.setValueAtTime(type==='error'?190:type==='win'?660:440,t);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.18)}catch(e){}}
function levelOf(){return Math.floor(Math.sqrt((xpData.xp||0)/40))+1}

function tierFor(){return hintUsed===0&&mistakes===0&&seconds<300?'diamond':hintUsed===0&&mistakes===0?'gold':mistakes<=1&&hintUsed<=1?'silver':'bronze'}
function renderLevels(){let level=levelOf(),base=40*(level-1)*(level-1),next=40*level*level;
$('rank').textContent='Level '+level+' · '+rankName(level);$('xp-fill').style.width=((xpData.xp-base)/(next-base)*100)+'%';$('xp-label').textContent=xpData.xp+' XP · '+(next-xpData.xp)+' XP to next level';
$('tier').textContent='Trophies: '+Object.entries(xpData.tierCounts).map(([k,v])=>k+' '+v).join(' · ');
let cleared=new Set(xpData.campaignCleared),max=cleared.size?Math.max(...cleared):0,unlocked=Math.min(120,Math.max(1,max+1));

let grid=$('campaign-levels');grid.replaceChildren();for(let n=1;n<=120;n++){let b=document.createElement('button');b.textContent=n;if(cleared.has(n))b.classList.add('cleared');if(n>unlocked){b.classList.add('locked');b.disabled=true}if(n===campaignLevel&&gameMode==='campaign')b.classList.add('current');b.onclick=()=>startCampaign(n);grid.append(b)}}
function reward(){let diff=$('difficulty').value,mult={easy:1,medium:2,hard:3,expert:4,master:5}[diff]||1,tier=tierFor(),bonus={bronze:0,silver:20,gold:50,diamond:100}[tier],earned=mult*40+bonus;xpData.xp+=earned;xpData.tierCounts[tier]=(xpData.tierCounts[tier]||0)+1;if(gameMode==='campaign'&&!xpData.campaignCleared.includes(campaignLevel))xpData.campaignCleared.push(campaignLevel);localStorage.setItem('sudoku-xp',JSON.stringify(xpData));$('award-message').textContent+=' · '+tier.toUpperCase()+' trophy · +'+earned+' XP';renderLevels();effects('win')}
function fillNotes(){if(done||paused)return;snapshot();for(let i=0;i<81;i++){if(puzzle[i]||values[i])continue;let clean=values.map((v,j)=>v===solution[j]?v:0);pencils[i]=new Set(choices(clean,i))}autoNotes=true;$('message').textContent='Candidates filled automatically';draw()}

function cleanNotes(n){if(!n||!autoNotes)return;for(let i=0;i<81;i++)if(!values[i]){let clean=values.map((v,j)=>v===solution[j]?v:0);pencils[i]=new Set(choices(clean,i))}}
function pauseGame(value){if(done)return;paused=value;$('pause-screen').classList.toggle('show',paused);store()}
function startCampaign(n){if(n<1||n>120)return;let cleared=xpData.campaignCleared||[],unlocked=Math.min(120,Math.max(1,cleared.length?Math.max(...cleared)+1:1));if(n>unlocked)return;gameMode='campaign';campaignLevel=n;dailyDate='';let diff=n<=20?'easy':n<=45?'medium':n<=70?'hard':n<=95?'expert':'master';$('difficulty').value=diff;random=seeded('campaign-'+n);solution=generate();puzzle=solution.slice();let target={easy:38,medium:47,hard:53,expert:56,master:58}[diff],removed=0;for(let i of shuffle([...Array(81).keys()])){if(removed>=target)break;let old=puzzle[i];puzzle[i]=0;if(count(puzzle.slice())!==1)puzzle[i]=old;else removed++}random=Math.random;reset();$('message').textContent='Campaign level '+n}

function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seeded(seed){let x=2166136261;for(let c of seed)x=Math.imul(x^c.charCodeAt(0),16777619);return ()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function streak(){let days=new Set(progress.days||[]),d=new Date(),n=0;if(!days.has(todayKey(d)))d.setDate(d.getDate()-1);while(days.has(todayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function stats(){let b=progress.best||{};$('statistics').textContent='Wins: '+progress.wins+' · Perfect: '+progress.perfect+' · No hints: '+progress.noHints+' · Streak: '+streak()+' days · Best: '+['easy','medium','hard'].map(k=>k+' '+(b[k]?Math.floor(b[k]/60)+':'+String(b[k]%60).padStart(2,'0'):'—')).join(' / ');
let items=[['First win',progress.wins>=1],['10 wins',progress.wins>=10],['50 wins',progress.wins>=50],['100 wins',progress.wins>=100],['Flawless',progress.perfect>0],['No hints',progress.noHints>0],['Speed solver',progress.fast>0],['7-day streak',streak()>=7],['30-day streak',streak()>=30],['Daily champion',(progress.dailyWins||[]).length>0]];
$('achievements').innerHTML=items.map(([name,ok])=>'<p class="'+(ok?'earned':'')+'">'+(ok?'🏆 ':'🔒 ')+name+'</p>').join('')}
function win(){if(awarded)return;awarded=true;if(gameMode==='daily'&&(progress.dailyWins||[]).includes(dailyDate)){$('message').textContent='Daily puzzle already rewarded';stats();return}let k=$('difficulty').value;progress.wins++;if(!mistakes)progress.perfect++;if(!hintUsed)progress.noHints++;if(seconds<180)progress.fast++;if(!progress.best[k]||seconds<progress.best[k])progress.best[k]=seconds;let day=todayKey();if(!progress.days.includes(day))progress.days.push(day);if(gameMode==='daily'&&!progress.dailyWins.includes(dailyDate))progress.dailyWins.push(dailyDate);localStorage.setItem('sudoku-progress',JSON.stringify(progress));award();reward();stats()}
try{trophies=Object.assign(trophies,JSON.parse(localStorage.getItem('sudoku-trophies')||'{}'))}catch(e){}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){let rows=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(x=>b*3+x)),cols=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(x=>b*3+x)),digits=shuffle([1,2,3,4,5,6,7,8,9]);return rows.flatMap(r=>cols.map(c=>digits[(r*3+(r/3|0)+c)%9]))}
function choices(b,i){let r=i/9|0,c=i%9,used=new Set;for(let k=0;k<9;k++){used.add(b[r*9+k]);used.add(b[k*9+c]);used.add(b[((r/3|0)*3+(k/3|0))*9+(c/3|0)*3+k%3])}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function explainHint(i){let r=i/9|0,c=i%9,n=solution[i];let board=values.map((v,j)=>v===solution[j]?v:0),opts=choices(board,i);let unit=(kind)=>{let ids=[];for(let j=0;j<81;j++){let rr=j/9|0,cc=j%9;if(kind==='row'&&rr===r||kind==='column'&&cc===c||kind==='box'&&(rr/3|0)===(r/3|0)&&(cc/3|0)===(c/3|0))ids.push(j)}return ids};let reason='';
if(opts.length===1)reason='Only '+n+' fits this square after checking its row, column and 3×3 box.';
else for(let kind of ['row','column','box']){let spots=unit(kind).filter(j=>!board[j]&&choices(board,j).includes(n));if(spots.length===1&&spots[0]===i){reason='In this '+kind+', '+n+' can only go in this square.';break}}

return 'Hint · Row '+(r+1)+', column '+(c+1)+': '+reason}
function count(b,limit=2){let best=-1,opts;for(let i=0;i<81;i++)if(!b[i]){let c=choices(b,i);if(!c.length)return 0;if(!opts||c.length<opts.length){best=i;opts=c;if(c.length===1)break}}if(best<0)return 1;let total=0;for(let n of opts){b[best]=n;total+=count(b,limit-total);if(total>=limit)break}b[best]=0;return total}

function award(){let difficulty=$('difficulty').value;trophies[difficulty]=(trophies[difficulty]||0)+1;localStorage.setItem('sudoku-trophies',JSON.stringify(trophies));$('award-message').textContent='You completed a '+difficulty+' puzzle in '+$('time').textContent+'!';$('celebrate').classList.add('show');for(let i=0;i<45;i++){let p=document.createElement('div');p.className='confetti';p.style.background=['#ffd66e','#75c6ff','#f8799c','#7de3ad'][i%4];p.style.setProperty('--dx',((Math.random()-.5)*window.innerWidth)+'px');p.style.setProperty('--dy',((Math.random()-.5)*window.innerHeight)+'px');document.body.append(p);setTimeout(()=>p.remove(),1300)}}
function fresh(){pauseGame(false);gameMode='classic';campaignLevel=0;dailyDate='';random=Math.random;solution=generate();puzzle=solution.slice();let target={easy:38,medium:47,hard:53,expert:56,master:58}[$('difficulty').value],removed=0;for(let i of shuffle([...Array(81).keys()])){if(removed>=target)break;let old=puzzle[i];puzzle[i]=0;if(count(puzzle.slice())!==1)puzzle[i]=old;else removed++}reset()}
function reset(){values=puzzle.slice();pencils=Array.from({length:81},()=>new Set);selected=-1;mistakes=0;hints=3;seconds=0;notesMode=false;history=[];done=false;lastChanged=-1;hintUsed=0;awarded=false;autoNotes=false;paused=false;$('pause-screen').classList.remove('show');$('message').textContent='Select a square to begin';draw()}
function snapshot(){history.push({values:values.slice(),pencils:pencils.map(s=>[...s]),mistakes,hints});if(history.length>100)history.shift()}
function enter(n){if(paused||done||selected<0||puzzle[selected])return;if(notesMode&&n){snapshot();pencils[selected].has(n)?pencils[selected].delete(n):pencils[selected].add(n)}else{if(values[selected]===n)return;snapshot();values[selected]=n;lastChanged=selected;pencils[selected].clear();cleanNotes(n);effects(n&&n!==solution[selected]?'error':'tap');if(n&&n===solution[selected])completedUnit(selected);if(n&&n!==solution[selected]){mistakes++;$('message').textContent='Incorrect number'}else $('message').textContent='';if(mistakes>=3){done=true;$('message').textContent='Game over. Undo or start a new game'}else if(values.every((v,i)=>v===solution[i])){done=true;$('message').textContent='You solved it!';win()}}draw()}

for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>enter(n);$('numbers').append(b)}
$('erase').onclick=()=>enter(0);$('pause').onclick=()=>pauseGame(true);$('resume').onclick=()=>pauseGame(false);$('auto-notes').onclick=fillNotes;$('campaign').onclick=()=>startCampaign(Math.min(120,Math.max(1,(xpData.campaignCleared.length?Math.max(...xpData.campaignCleared)+1:1))));$('notes').onclick=()=>{notesMode=!notesMode;draw()};$('undo').onclick=()=>{if(paused)return;let h=history.pop();if(!h)return;values=h.values;pencils=h.pencils.map(x=>new Set(x));mistakes=h.mistakes;hints=h.hints;done=false;draw()};$('hint').onclick=()=>{if(paused||done||!hints)return;let i=selected>=0&&!puzzle[selected]&&values[selected]!==solution[selected]?selected:values.findIndex((v,j)=>!puzzle[j]&&v!==solution[j]);if(i<0)return;snapshot();selected=i;let explanation=explainHint(i);values[i]=solution[i];lastChanged=i;$('message').textContent=explanation;pencils[i].clear();hints--;hintUsed++;if(values.every((v,j)=>v===solution[j])){done=true;$('message').textContent='You solved it!';win()}draw()};$('close-award').onclick=()=>{$('celebrate').classList.remove('show')};$('new').onclick=()=>gameMode==='daily'?startDaily(true):fresh();$('restart').onclick=reset;$('difficulty').onchange=fresh;$('classic').onclick=fresh;$('daily').onclick=()=>startDaily(false);
$('theme').value=localStorage.getItem('sudoku-theme')||'neon';document.body.dataset.theme=$('theme').value;$('theme').onchange=()=>{document.body.dataset.theme=$('theme').value;localStorage.setItem('sudoku-theme',$('theme').value)};
function startDaily(force){let day=todayKey();if(!force&&gameMode==='daily'&&dailyDate===day){$('message').textContent='Today’s challenge is already open';return}gameMode='daily';dailyDate=day;$('difficulty').value='medium';random=seeded('daily-'+day);solution=generate();puzzle=solution.slice();let removed=0;for(let i of shuffle([...Array(81).keys()])){if(removed>=47)break;let old=puzzle[i];puzzle[i]=0;if(count(puzzle.slice())!==1)puzzle[i]=old;else removed++}random=Math.random;reset();$('message').textContent='Daily puzzle '+day}
try{let s=JSON.parse(localStorage.getItem('sudoku-save'));if(!s||s.solution.length!==81)throw Error('missing');solution=s.solution;puzzle=s.puzzle;values=s.values;pencils=s.pencils.map(x=>new Set(x));selected=s.selected;mistakes=s.mistakes;hints=s.hints;seconds=s.seconds;notesMode=s.notesMode;done=s.done;gameMode=s.gameMode||'classic';dailyDate=s.dailyDate||'';hintUsed=s.hintUsed||0;awarded=!!s.awarded;campaignLevel=s.campaignLevel||0;autoNotes=!!s.autoNotes;paused=!!s.paused;$('pause-screen').classList.toggle('show',paused);$('difficulty').value=s.difficulty;draw()}catch(e){fresh()}
$('sound').checked=localStorage.getItem('sudoku-sound')==='true';$('haptic').checked=localStorage.getItem('sudoku-haptic')==='true';$('sound').onchange=()=>localStorage.setItem('sudoku-sound',$('sound').checked);$('haptic').onchange=()=>localStorage.setItem('sudoku-haptic',$('haptic').checked);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!done)pauseGame(true)});setInterval(()=>{if(!done&&!paused){seconds++;$('time').textContent=String(seconds/60|0).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');store()}},1000);
